services:
  app:
    user: "1000:1000"
    build:
      context: .
      dockerfile: Dockerfile
    container_name: be_lucky_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - be_lucky

  webserver:
    image: nginx:alpine
    container_name: be_lucky_nginx
    restart: unless-stopped
    ports:
      - "8006:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx:/etc/nginx/conf.d
    networks:
      - be_lucky

  db:
    image: mysql:8.0
    container_name: be_lucky_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: db_compro
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_PASSWORD: rootpassword
      MYSQL_USER: user
    ports:
      - "3321:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - be_lucky

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: be_lucky_phpmyadmin
    restart: unless-stopped
    ports:
      - "8090:80"
    environment:
      PMA_HOST: be_lucky_mysql
    networks:
      - be_lucky

networks:
  be_lucky:

volumes:
  dbdata: